[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.3.0"]
build-backend = "maturin"

[project]
name = "polars-ngrams"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
  "maturin[patchelf]>=1.8.3",
  "pandas>=2.2.3",
  "polars-lts-cpu>=1.27.1",
  "pyarrow>=20.0.0",
  "tabulate>=0.9.0",
]

[tool.maturin]
module-name = "polars_ngrams._internal"

[[tool.mypy.overrides]]
module = "polars.utils.udfs"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
